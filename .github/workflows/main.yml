
name: Jarvis Ultimate Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Jarvis Project
        run: |
          unzip -q JarvisUltimate_v0.7.zip
          ls -la JarvisUltimate

      - name: Run Tests
        working-directory: JarvisUltimate
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Build APK
        working-directory: JarvisUltimate
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Ultimate-APK
          path: JarvisUltimate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
