
name: Jarvis Ultimate Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        working-directory: JarvisUltimate
        run: gradle :app:testDebugUnitTest

      - name: Build Jarvis APK
        working-directory: JarvisUltimate
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Ultimate-APK
          path: JarvisUltimate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
