
name: Jarvis Ultimate Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle and Build Jarvis
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found Gradle: $GRADLEW"

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"

          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Ultimate-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
